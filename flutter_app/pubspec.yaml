name: halaqat_app
description: نظام إدارة الحلقات — تطبيق أندرويد وآيفون
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3

  # حالة التطبيق
  provider: ^6.1.2

  # واجهة ورسوم بيانية (تعادل Chart.js في main.html الحالي)
  fl_chart: ^0.69.0

  # تنسيق تاريخ ووقت عربي
  intl: ^0.19.0

  # تخزين محلي بسيط (تذكّر آخر تسجيل دخول)
  shared_preferences: ^2.3.2

  # الموقع الجغرافي (تسجيل حضور/انصراف المعلم بالموقع، وتحديد نطاق العمل الجغرافي)
  geolocator: ^13.0.2

  # نداءات شبكة (مؤشر الأذان عبر Aladhan API)
  http: ^1.2.2

  # فتح روابط واتساب (wa.me) والاتصال الهاتفي
  url_launcher: ^6.3.1

  # توليد ملفات PDF (كشوف الحضور، مسير الرواتب، السجل الكامل)
  pdf: ^3.11.1
  printing: ^5.13.3

  # توليد واستيراد ملفات Excel (تصدير/استيراد الطلاب والحضور)
  excel: ^4.0.6

  # مشاركة الملفات المُصدَّرة (PDF/Excel)
  share_plus: ^10.1.2

  # اختيار ملف للاستيراد من الجهاز
  file_picker: ^10.3.3

  # مسار مجلد مؤقت لحفظ الملفات المُصدَّرة قبل مشاركتها
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

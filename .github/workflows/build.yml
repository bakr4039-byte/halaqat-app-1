name: Build Halaqat App

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK/AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      # لازم android/ موجود مسبقًا في المستودع (نتج عن تشغيل setup.sh محليًا
      # مرة واحدة وعمل commit له) — الـ CI هنا بيبني بس، مش بيولّد المشروع.
      - run: flutter pub get

      # فحص ثابت (static analysis) بيكشف أخطاء الكود (زي أقواس ناقصة/زايدة)
      # بسرعة قبل محاولة البناء الكاملة. التقرير نظيف الآن، فالفحص بيوقف
      # الـ CI لو ظهرت أي مشكلة جديدة في الكود مستقبلًا.
      - name: Static analysis (flutter analyze)
        run: flutter analyze

      - name: Decode release signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<KEYPROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          KEYPROPS

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: iOS (بدون توقيع — للاختبار فقط)
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - run: flutter pub get
      # بناء بدون توقيع (no-codesign) — كافي للتأكد إن الكود بيتبني صح.
      # للتوزيع الفعلي على App Store/TestFlight لازم:
      #  1) حساب Apple Developer فعّال
      #  2) شهادة توقيع (Distribution Certificate) + Provisioning Profile
      #  3) رفعهم كـ GitHub Secrets واستخدام fastlane أو
      #     xcodebuild -exportArchive بدل flutter build ipa هنا
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-build
          path: flutter_app/build/ios/iphoneos/Runner.app

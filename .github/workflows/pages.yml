name: Publish shared Firebase web
on:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Require an existing Firebase deployment credential
        env:
          FIREBASE_DEPLOY_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HALAQAT_APP_272FF || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_DEPLOY_TOKEN" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Firebase deployment access is missing. Configure FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_HALAQAT_APP_272FF before publishing the new web client."
            exit 1
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            umask 077
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          fi
      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: node --test test/shared_attendance.cjs
        working-directory: functions
      - name: Deploy compatible Firebase backend before the web client
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@14 deploy --only functions,firestore --project halaqat-app-272ff --non-interactive
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Check and build web against the registered Firebase project
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href /halaqat-app-1/ --dart-define=FIREBASE_WEB_APP_ID=1:648760052878:web:eaf439ba2f0c8d00258ddf --dart-define=FIREBASE_WEB_API_KEY=AIzaSyAlnvYtTjMAAjaf7liAaPxCFK93URC_P8Q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, firebase]
    steps:
      - name: Deploy web
        id: deployment
        uses: actions/deploy-pages@v4

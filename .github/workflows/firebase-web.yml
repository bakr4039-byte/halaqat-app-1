name: Validate Firebase Web and Android

on:
  push:
    branches: [main, codex/firebase-web]
    paths: ['flutter_app/**', 'functions/**', 'firestore/**', 'firebase.json', '.github/workflows/firebase-web.yml']
  pull_request:
    paths: ['flutter_app/**', 'functions/**', 'firestore/**', 'firebase.json', '.github/workflows/firebase-web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href / --dart-define=FIREBASE_WEB_APP_ID=1:648760052878:web:eaf439ba2f0c8d00258ddf --dart-define=FIREBASE_WEB_API_KEY=AIzaSyAlnvYtTjMAAjaf7liAaPxCFK93URC_P8Q
      - uses: actions/upload-artifact@v4
        with:
          name: original-app-web
          path: flutter_app/build/web/
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-web-and-android
          path: |
            flutter_app/build/web/
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test test/shared_attendance.cjs
